# BabyLog — nginx reverse proxy in front of gunicorn (127.0.0.1:8000)
# Place at /etc/nginx/sites-available/babylog and symlink into sites-enabled.

# Rate-limit zones (defined at http level — put in /etc/nginx/nginx.conf http{}
# or keep here if this is included there). Limits abusive request bursts.
limit_req_zone $binary_remote_addr zone=babylog_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=babylog_login:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;   # <-- your domain

    # Don't leak the server version.
    server_tokens off;

    # Cap request body size.
    client_max_body_size 1m;

    # Extra brute-force cushion on the login endpoint (app also locks out).
    location = /login {
        limit_req zone=babylog_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=babylog_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # If behind Cloudflare, forward the country header for geo-block:
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}
